name: Rust checks
on: [push, pull_request]
jobs:
  cpu:
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@1.92.0
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets --features convert,onnx,cpu-opt --locked -- -D warnings
      - run: cargo test --workspace --features convert,onnx,cpu-opt --locked
      - run: cargo check --features wgpu,onnx,cpu-opt --locked
      # Compile-only: CUDA libraries load at runtime, the version pins cudarc bindings.
      - if: runner.os == 'Linux'
        run: cargo check --features cuda,onnx,cpu-opt --locked
        env:
          CUDARC_CUDA_VERSION: "12020"
