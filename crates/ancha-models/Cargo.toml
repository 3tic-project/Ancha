[package]
name = "ancha-models"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish = false

[features]
default = []
wgpu = ["burn/wgpu", "burn/fusion"]
# CUDA also builds the hand-written CubeCL kernels (fused attention, GEMM) in `fused`.
cuda = ["burn/cuda", "burn/fusion", "dep:burn-cubecl", "dep:burn-fusion", "dep:burn-ir", "dep:cubecl"]
convert = ["burn-store/pytorch"]
onnx = ["dep:onnx-rs"]

[dependencies]
anyhow.workspace = true
burn.workspace = true
serde.workspace = true
serde_json.workspace = true
safetensors = "=0.8.0"
burn-store = { version = "=0.21.0", default-features = false, features = ["std", "safetensors"] }
sha2 = "0.10"
onnx-rs = { version = "=0.1.2", optional = true }
burn-cubecl = { version = "=0.21.0", default-features = false, features = ["std", "fusion"], optional = true }
burn-fusion = { version = "=0.21.0", default-features = false, features = ["std"], optional = true }
burn-ir = { version = "=0.21.0", default-features = false, features = ["std"], optional = true }
cubecl = { version = "=0.10.0", default-features = false, features = ["std"], optional = true }

[dev-dependencies]
ancha-kernels = { path = "../ancha-kernels" }
tempfile = "3"

[[example]]
name = "fused_attention"
required-features = ["cuda"]

[[example]]
name = "fused_linear"
required-features = ["cuda"]
